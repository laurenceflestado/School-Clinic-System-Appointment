<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurse Dashboard - School Clinic</title>
<link rel="stylesheet" href="../shared/css/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="dashboard.html">School Clinic - Nurse</a>
  <nav>
    <span id="welcome"></span>
    <a href="dashboard.html">Appointments</a>
    <a href="queue.html">Queue</a>
    <a href="patients.html">Patients</a>
    <button id="change-pw-btn" class="secondary" style="background:none;border:none;color:#fff;text-decoration:underline">Change password</button>
    <button id="logout-btn">Log Out</button>
  </nav>
</header>
<main>
  <h1>Appointment Requests</h1>
  <div class="tabs" id="filter-tabs">
    <button data-status="PENDING" class="active">Pending</button>
    <button data-status="APPROVED">Approved</button>
    <button data-status="">All</button>
  </div>
  <div class="card">
    <table id="appt-table">
      <thead><tr><th>Reference</th><th>Patient</th><th>Service</th><th>Date</th><th>Time</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none">Nothing here.</div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/session.js"></script>
<script src="../js/api.js"></script>
<script src="../js/nurse-dashboard.js"></script>
</body>
</html>

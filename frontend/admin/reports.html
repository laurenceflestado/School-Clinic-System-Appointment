<!DOCTYPE html>
<html lang="en">

<body>
<header class="site-header">

    <span id="welcome"></span>
    <a href="dashboard.html">Dashboard</a>

<main>
  <h1>Reports</h1>
  <div class="card">
    <label for="r-date">Date</label>
    <input type="date" id="r-date">
  </div>
  <div class="grid grid-3" id="summary-cards"></div>
  <div class="card">
    <h2>Capacity &amp; Occupancy</h2>
    <table id="capacity-table">
      <thead><tr><th>Service</th><th>Nurse</th><th>Hours</th><th>Booked / Capacity</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <p class="hint">Counts only — no clinical detail is shown here. See Nurse &gt; Patients for medical history (nurse-only, logged).</p>
</main>

<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1"> 
<title>Schedules - Admin</title> 
<link rel="stylesheet" href="../shared/css/style.css"> 
</head> 
<body> 

<header class="site-header"> 
  <a class="brand" href="dashboard.html">School Clinic - Admin</a> 
  <nav> 
    <span id="welcome"></span> 
    <a href="dashboard.html">Dashboard</a> 
    <a href="appointments.html">Appointments</a> 
    <a href="nurses.html">Nurses</a> 
    <a href="schedules.html">Schedules</a> 
    <a href="reports.html">Reports</a> 
    <a href="audit.html">Audit Log</a> 
    <button id="logout-btn">Log Out</button> 
  </nav> 
</header> 

<main> 
  <h1>Clinic Schedules</h1> 
 
  <div class="card"> 
    <h2>Services</h2> 
    <div id="services-list" class="grid grid-3"></div> 

    <form id="service-form" style="margin-top:12px"> 
      <label>New service name</label> 
      <input type="text" id="s-name" required> 

      <label>Description</label> 
      <input type="text" id="s-desc"> 

      <button type="submit" style="margin-top:8px">Add Service</button> 
    </form>

    <!-- OPTIONAL SERVICES - IDINAGDAG LANG -->
    <div style="margin-top:20px">
      <h3>Optional Services</h3>

      <div class="grid grid-3">
        <div>
          <label>General Consultation</label>
        </div>

        <div>
          <label>Medical Check-up</label>
        </div>

        <div>
          <label>First Aid / Minor Injury</label>
        </div>

        <div>
          <label>Medical Certificate</label>
        </div>

        <div>
          <label>Health Screening</label>
        </div>

        <div>
          <label>Dental Consultation</label>
        </div>

        <div>
          <label>Immunization</label>
        </div>

        <div>
          <label>Follow-up Consultation</label>
        </div>

        <div>
          <label>Medicine / Prescription</label>
        </div>
      </div>
    </div>
    <!-- END OPTIONAL SERVICES -->
 
  </div> 
 
  <div class="card"> 
    <h2>Create Schedule</h2> 

    <form id="schedule-form" class="grid grid-2"> 
      <div>
        <label>Service</label>
        <select id="sc-service" required></select>
      </div> 

      <div>
        <label>Nurse</label>
        <select id="sc-nurse" required></select>
      </div> 

      <div>
        <label>Date</label>
        <input type="date" id="sc-date" required>
      </div> 

      <div>
        <label>Slot length (minutes)</label>
        <input type="number" id="sc-slot" value="20" required>
      </div> 

      <div>
        <label>Start Time</label>
        <input type="time" id="sc-start" value="08:00" required>
      </div> 

      <div>
        <label>End Time</label>
        <input type="time" id="sc-end" value="16:00" required>
      </div> 

      <div>
        <label>Capacity per slot</label>
        <input type="number" id="sc-capacity" value="2" required>
      </div> 

      <div style="grid-column:1/-1">
        <p class="hint" id="conflict-hint"></p>
        <button type="submit">Create Schedule</button>
      </div> 
    </form> 
  </div> 
 
  <div class="card"> 
    <h2>Filter Schedules</h2> 

    <div class="grid grid-2"> 
      <div>
        <label>Date</label>
        <input type="date" id="f-date">
      </div> 

      <div>
        <label>Nurse</label>
        <select id="f-nurse">
          <option value="">All</option>
        </select>
      </div> 
    </div> 

    <table id="schedule-table"> 
      <thead>
        <tr>
          <th>Service</th>
          <th>Date</th>
          <th>Time</th>
          <th>Nurse</th>
          <th>Capacity/slot</th>
          <th>Active</th>
        </tr>
      </thead> 

      <tbody></tbody> 
    </table> 
  </div> 

</main> 

<script src="../js/config.js"></script> 
<script src="../js/session.js"></script> 
<script src="../js/api.js"></script> 
<script src="../js/admin-schedules.js"></script> 

</body> 
</html>

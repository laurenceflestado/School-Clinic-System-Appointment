<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Login - School Clinic</title>
<link rel="stylesheet" href="../shared/css/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="../index.html">School Clinic</a>
  <nav><a href="../index.html">Home</a><a href="register.html">Create account</a></nav>
</header>
<main style="max-width:420px">
  <h1>Patient Login</h1>
  <form class="card" id="patient-login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" required>
    <button type="submit" style="margin-top:14px">Log In</button>
  </form>
</main>
<script src="../js/config.js"></script>
<script src="../js/session.js"></script>
<script src="../js/api.js"></script>
<script src="../js/patient-login.js"></script>
</body>
</html>
